## КРАТКИЙ ОБЗОР ПРОЦЕССА

process_overview:
  description: |
    Полный цикл разработки эпика через все фазы.
    Детальное описание см. в docs/workflow-guides/phases.md

  phases_summary:
    phase_1: "Инициализация → Создание очереди историй (story переводится в ready-for-dev автоматически; SM-фаза удалена — истории проверяются пользователем на этапе sprint-planning)"
    phase_2: "Development → Реализация задач"
    phase_2_5: "Code Review + Workflow Validation → Объединённая проверка (код + Dev Agent Record, один субагент)"
    phase_3: "QA Testing → Тестирование функциональности"
    phase_3_5: "Validation (QA) → Проверка QA Results (Victor)"
    phase_4: "Next Story → Переход к следующей истории или завершение"
    phase_5: "Epic Completion → Обновление статуса эпика"
    phase_6: "⚠️ ОБЯЗАТЕЛЬНАЯ → PO Documentation (обновление README, PRD)"
    phase_7: "⚠️ ОБЯЗАТЕЛЬНАЯ → Architect Documentation (обновление архитектуры)"
    phase_8: "⚠️ ОБЯЗАТЕЛЬНАЯ → Final Commit (git commit документации)"

    important_note: |
      КРИТИЧЕСКИ ВАЖНО: Фазы 6, 7, 8 являются ОБЯЗАТЕЛЬНЫМИ для завершения эпика.
      Эпик считается завершённым ТОЛЬКО после выполнения всех трёх финальных фаз.
      НЕ останавливайся после phase_5, ВСЕГДА продолжай до phase_8 и completed.

  decision_points:
    development: "SUCCESS → Code Review | BLOCKED → HALT"
    code_review: "PASS → QA only when no workflow issues and no CRITICAL/HIGH/MEDIUM-block code issues | NEEDS_WORK → return_to_dev (workflow_issues + CRITICAL/HIGH/MEDIUM-block code_issues); MEDIUM-advise/LOW/INFO stay recommendations"
    qa_testing: "PASS → Validation(QA) | FAIL → return_to_dev"
    validation_qa: "PASS → Next Story | FAIL → return_to_qa"

  error_handling:
    max_reopens: 3
    on_max_reopens: "ESCALATE к пользователю"
    dev_blocked: "HALT с описанием блокера"
    details: "См. docs/workflow-guides/error-handling.md"

## ВОССТАНОВЛЕНИЕ КОНТЕКСТА

context_recovery:
  summary: "После сжатия контекста оркестратор восстанавливает состояние из sprint-status.yaml"
  documentation: "_bmad/bmm/4-implementation/bmad-epic-dev-cycle/guides/context-recovery.md"

  quick_reference:
    step_1: "Перечитать _bmad/core/config.yaml"
    step_2: "Перечитать _bmad/bmm/4-implementation/bmad-epic-dev-cycle/workflow.yaml"
    step_3: "Найти все sprint-status файлы (по умолчанию glob docs/{activeLibrary}/sprint-status-epic-*.yaml)"
    step_4: "Выбрать первый epic-{N} со статусом != done → текущий эпик"
    step_5: "Найти текущую историю: первая story в sprint-plan order со статусом != done"
    step_6: "Определить фазу по статусу истории в sprint-status и содержимому story-файла (Change Log, Dev Agent Record, QA Results)"
    step_7: "Продолжить с правильной фазы"

  critical_check_after_recovery:
    description: "ОБЯЗАТЕЛЬНАЯ проверка после восстановления контекста"
    steps:
      - "Если ВСЕ истории эпика имеют development_status: done → проверить epic-{N} статус"
      - "Если epic-{N}: done → проверить наличие документации от PO/Architect в Change Log эпика"
      - "Если документация отсутствует → выполнить фазы 7, 8, 9"
      - "Только после фаз 7, 8, 9 → next_epic_check → completed"

  state_determination:
    all_stories_done_but_epic_pending:
      all_story_status: "done (в sprint-status.yaml)"
      epic_status_in_yaml: "in-progress"
      next_state: "epic_complete"

    epic_done_but_no_po_docs:
      epic_status_in_yaml: "done"
      check: "Есть ли запись 'PO Documentation' в Change Log эпика?"
      if_no: "next_state = po_documentation"
      if_yes: "check Architect"

    epic_done_but_no_architect_docs:
      epic_status_in_yaml: "done"
      check: "Есть ли запись 'Architect Documentation' в Change Log эпика?"
      if_no: "next_state = architect_documentation"
      if_yes: "check final commit"

    epic_done_but_no_final_commit:
      epic_status_in_yaml: "done"
      check: "Есть ли git commit с документацией после последней истории?"
      if_no: "next_state = final_commit"
      if_yes: "next_state = next_epic_check"
