services:
  knowledge-mcp:
    container_name: knowledge-mcp
    build: .
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Volume для сохранения SQLite БД и кэша репозиториев между перезапусками
      - ./data:/data
      # Директория с локальными исходниками на хосте (монтируется как read-only)
      - ${REPOS_DIR:-./src}:/repos:ro
      # Горячий маппинг обновленного кода v1.8 и скомпилированного дашборда
      - ./knowledge_mcp:/app/knowledge_mcp
      - ./frontend/dist/dashboard/browser:/app/frontend/dist/dashboard/browser
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=${DB_PATH:-/data/knowledge.db}
      - CONFIG_PATH=/data/config.yaml
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - GITHUB_PAT=${GITHUB_PAT:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      - LLM_MODEL=${LLM_MODEL:-kr/claude-sonnet-4.5}
      - LLM_API_KEY=${LLM_API_KEY:-sk-local}
    
    # Ограничение ресурсов контейнера
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

    # Автоматический перезапуск при падении
    restart: unless-stopped

    # Команда запуска HTTP/WebSocket сервера триггеров и дашборда
    command: python -m knowledge_mcp.main --db-path /data/knowledge.db serve --host 0.0.0.0 --port 8000
