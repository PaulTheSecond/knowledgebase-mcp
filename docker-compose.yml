services:
  knowledge-mcp:
    container_name: knowledge-mcp
    build: .
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Volume для сохранения SQLite БД и кэша репозиториев между перезапусками
      - ./data:/data
      # Директория с локальными исходниками на хосте (монтируется как read-only)
      - ${REPOS_DIR:-./src}:/repos:ro
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=/data/knowledge.db
      - CONFIG_PATH=/data/config.yaml
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-dev_secret_12345}
      - GITHUB_PAT=${GITHUB_PAT:-}
      - LLM_BASE_URL=${DOCKER_LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      - LLM_MODEL=${LLM_MODEL:-kr/claude-sonnet-4.5}
      - LLM_API_KEY=${LLM_API_KEY:-sk-1a88d79028c9b93b-6m30qv-e5a42f22}
    
    # Ограничение ресурсов контейнера
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

    # Автоматический перезапуск при падении
    restart: unless-stopped

    # Команда запуска HTTP/WebSocket сервера триггеров и дашборда
    command: python -m knowledge_mcp.main --db-path /data/knowledge.db serve --host 0.0.0.0 --port 8000
