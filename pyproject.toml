[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgebase-mcp"
version = "1.6.0"
description = "Local Knowledge Base & RAG Server with MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "sqlite-vec>=0.1.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "pathspec>=0.11.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.29.1,<2.0.0",
    "watchdog>=3.0.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-sql>=0.3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
knowledge-mcp = "knowledge_mcp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
