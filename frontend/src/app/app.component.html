<tui-root>
  <div class="app-layout">
    <app-sidebar (openSettings)="openSettings()"></app-sidebar>
    <div class="app-main">
      <app-header></app-header>
      <main class="app-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  @if (isSettingsOpen()) {
    <app-settings-dialog (close)="closeSettings()"></app-settings-dialog>
  }
</tui-root>
