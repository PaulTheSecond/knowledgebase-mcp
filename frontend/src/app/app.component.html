<tui-root>
  <div class="app-layout">
    <app-sidebar (openSettings)="openSettings()"></app-sidebar>
    <div class="app-main">
      <app-header></app-header>
      <main class="app-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  @if (isSettingsOpen()) {
    <div class="modal-backdrop" (click)="closeSettingsOnBackdrop($event)">
      <app-settings-dialog (close)="closeSettings()"></app-settings-dialog>
    </div>
  }

  @if (auth.isAuthModalOpen()) {
    <div class="modal-backdrop">
      <app-auth-dialog></app-auth-dialog>
    </div>
  }
</tui-root>
