<div class="auth-card">
  <div class="auth-header">
    <div class="auth-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h2 class="auth-title">{{ i18n.t('auth.title') }}</h2>
    <p class="auth-subtitle">{{ i18n.t('auth.subtitle') }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    @if (errorMessage()) {
      <div class="auth-alert">
        {{ errorMessage() }}
      </div>
    }

    <div class="form-group">
      <label class="form-label">{{ i18n.t('auth.username') }}</label>
      <input 
        class="form-input" 
        formControlName="username" 
        type="text" 
        autocomplete="username" 
        required 
      />
    </div>

    <div class="form-group">
      <label class="form-label">{{ i18n.t('auth.password') }}</label>
      <input 
        class="form-input" 
        formControlName="password" 
        type="password" 
        autocomplete="current-password" 
        required 
      />
    </div>

    <button type="submit" class="btn btn-primary auth-btn" [disabled]="loading() || form.invalid">
      @if (loading()) {
        <span>{{ i18n.t('auth.checking') }}</span>
      } @else {
        <span>{{ i18n.t('auth.submit') }}</span>
      }
    </button>
  </form>
</div>
